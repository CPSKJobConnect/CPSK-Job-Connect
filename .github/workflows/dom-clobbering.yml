name: "DOM Clobbering Check"

on:
  push:
    branches: [ main, 'security/**', 'main' ]
  pull_request:
    branches: [ main ]

jobs:
  lint-dom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run DOM clobbering ESLint check
        run: npm run lint:dom
