name: Cookie Size Scan

on:
  push:
  pull_request:

jobs:
  cookie-size-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run cookie size scanner
        run: node scripts/check-cookie-size.mjs
