name: Text Safety Check

on:
  push:
    branches: [ main, master, 'security/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  text-safety:
    name: Run text-safety scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Run text-safety check
        run: npm run lint:text-safety
